{% extends 'base.html' %}

{% block content %}
<div class="tabs">
    <a href="{{ url_for('index') }}" class="tab">📖 Books</a>
    <a href="{{ url_for('authors_page') }}" class="tab">👤 Authors</a>
</div>
<div class="card">
    <div class="card-header"><h2>+ Add New Book</h2></div>
    <div class="card-body" style="padding:20px">
        <form method="POST" action="{{ url_for('add_book') }}" enctype="multipart/form-data">
            <div class="form-group">
                <label>Book ID</label>
                <input type="number" name="book_id" value="{{ next_id }}" required>
            </div>
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" placeholder="Enter book title" required>
            </div>
            <div class="form-group">
                <label>Price</label>
                <input type="number" step="0.01" name="price" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Author</label>
                <select name="author_id">
                    <option value="">— No Author —</option>
                    {% for a in authors %}
                    <option value="{{ a.author_id }}">{{ a.author_id }}: {{ a.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>🖼️ Cover Image (Bonus)</label>
                <input type="file" name="cover" accept="image/*">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Book</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
