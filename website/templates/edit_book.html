{% extends 'base.html' %}

{% block content %}
<div class="tabs">
    <a href="{{ url_for('index') }}" class="tab">📖 Books</a>
    <a href="{{ url_for('authors_page') }}" class="tab">👤 Authors</a>
</div>
<div class="card">
    <div class="card-header"><h2>✏️ Edit Book (ID: {{ book.book_id }})</h2></div>
    <div class="card-body" style="padding:20px">
        <form method="POST" action="{{ url_for('edit_book', book_id=book.book_id) }}" enctype="multipart/form-data">
            <input type="hidden" name="current_cover" value="{{ book.cover or '' }}">
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" value="{{ book.title }}" required>
            </div>
            <div class="form-group">
                <label>Price</label>
                <input type="number" step="0.01" name="price" value="{{ book.price or '' }}">
            </div>
            <div class="form-group">
                <label>Author</label>
                <select name="author_id">
                    <option value="">— No Author —</option>
                    {% for a in authors %}
                    <option value="{{ a.author_id }}" {% if book.author_id == a.author_id %}selected{% endif %}>{{ a.author_id }}: {{ a.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>🖼️ Cover Image (Bonus)</label>
                {% if book.cover %}
                <div style="margin-bottom:8px">
                    <img src="{{ url_for('static', filename=book.cover) }}" class="book-cover" style="width:60px;height:80px">
                    <label style="font-size:12px"><input type="checkbox" name="remove_cover" value="1"> Remove cover</label>
                </div>
                {% endif %}
                <input type="file" name="cover" accept="image/*">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
